name: Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "syscall_logger/**"
      - "module.json"
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  kpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Build kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
        run: |
          mkdir target

          for dir in $(ls -d */ | grep -v '^KernelPatch/$\|^target/$\|^arm-gnu-toolchain'); do
            [ -f "${dir}Makefile" ] || continue
            make -C ${dir}
            mv ${dir}*.kpm target
          done

      - name: Upload kpm
        uses: actions/upload-artifact@v4
        with:
          name: kpm
          path: target/*.kpm

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: scl-viewer-release
          path: app/build/outputs/apk/release/*.apk

  release:
    # A release is cut only for a push to main whose commit message names a version, e.g.
    #   "app 2.4.0: ..."  and/or  "module 0.11.0: ..."
    # The tag is built from those versions (app-2.4.0, module-0.11.0, or app-2.4.0_module-0.11.0),
    # the release body is the commit message plus the commit hash. No rolling "latest" tag.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [kpm, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read versions from the commit message
        id: ver
        run: |
          git log -1 --pretty=%B > msg.txt
          app=$(grep -ioE '\bapp v?[0-9]+\.[0-9]+\.[0-9]+' msg.txt | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          mod=$(grep -ioE '\bmodule v?[0-9]+\.[0-9]+\.[0-9]+' msg.txt | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          tag=""
          [ -n "$app" ] && tag="app-$app"
          [ -n "$mod" ] && tag="${tag:+${tag}_}module-$mod"
          { echo "app=$app"; echo "mod=$mod"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          { cat msg.txt; printf '\n\nCommit: %s\n' "$GITHUB_SHA"; } > body.md

      - name: Download artifacts
        if: steps.ver.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Put the app version in the APK name
        if: steps.ver.outputs.app != ''
        run: mv dist/app-release.apk "dist/SclViewer-${{ steps.ver.outputs.app }}.apk" || true

      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          commit: ${{ github.sha }}
          bodyFile: body.md
          artifacts: "dist/*"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

      - name: No release (no version in the commit message)
        if: steps.ver.outputs.tag == ''
        run: echo "::notice::No 'app x.y.z' / 'module x.y.z' in the commit message, so no release was cut."
