name: Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "syscall_logger/**"
      - "module.json"
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  kpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Build kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
        run: |
          mkdir target

          for dir in $(ls -d */ | grep -v '^KernelPatch/$\|^target/$\|^arm-gnu-toolchain'); do
            [ -f "${dir}Makefile" ] || continue
            make -C ${dir}
            mv ${dir}*.kpm target
          done

      - name: Upload kpm
        uses: actions/upload-artifact@v4
        with:
          name: kpm
          path: target/*.kpm

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_ALIAS" "$KEYSTORE_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: scl-viewer-release
          path: app/build/outputs/apk/release/*.apk

  release:
    # Every push to main publishes a release. Tag and title are just
    #   <workflow run number>-<short commit hash>
    # file names keep their own stem, e.g. sclviewer-57-a1b2c3d.apk and
    # syscall_logger-57-a1b2c3d.kpm. The body is the commit message plus the full hash.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [kpm, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name everything <file>-<run>-<hash>
        id: name
        env:
          RUN: ${{ github.run_number }}
        run: |
          id="${RUN}-${GITHUB_SHA::7}"
          for f in dist/*; do
            base="${f##*/}"
            ext="${base##*.}"
            stem="${base%.*}"
            case "$ext" in
              apk) stem="sclviewer" ;;
              *)   stem="$(printf '%s' "$stem" | sed -E 's/[_-]v?[0-9]+(\.[0-9]+)*$//')" ;;
            esac
            mv "$f" "dist/${stem}-${id}.${ext}"
          done
          ls -l dist
          echo "tag=${id}" >> "$GITHUB_OUTPUT"
          { git log -1 --pretty=%B; printf '\n\nCommit: %s\n' "$GITHUB_SHA"; } > body.md

      - name: Publish release
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.tag }}
          commit: ${{ github.sha }}
          bodyFile: body.md
          artifacts: "dist/*"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
